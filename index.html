<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>football-quiz</title>
  </head>
  <body>
    <div id="root">
      <div
        id="boot-fallback"
        style="min-height: 100dvh; display: flex; align-items: center; justify-content: center; background: #02080b; color: #ffffff; font: 600 18px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; text-align: center; padding: 24px;"
      >
        Ball Knowledge loading...
      </div>
    </div>
    <script>
      (function () {
        var userAgent = window.navigator && window.navigator.userAgent ? window.navigator.userAgent : "";
        var isIosDevice = /iPad|iPhone|iPod/.test(userAgent);
        if (window.location.protocol === "capacitor:" || isIosDevice) {
          document.body.classList.add("capacitor-ios");
        }
      })();
      window.__ballKnowledgeBootTimer = window.setTimeout(function () {
        var fallback = document.getElementById("boot-fallback");
        if (fallback) fallback.textContent = "Startup took too long. Check console logs.";
      }, 15000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
